<dialog
    #myDialog
    *transloco="let t"
    class="w-2xl"
    (close)="reasonControl.reset()"
>
    @if (vm(); as vm) {
        <app-dialog>
            <app-page-header>
                <h2>{{ t(vm.titleKey) }}</h2>
                <app-button
                    [vm]="vm.closeButtonXVM"
                    (click)="myDialog.close()"
                    actionGroup
                >
                    <mat-icon>{{ vm.closeButtonXVM.icon }}</mat-icon>
                </app-button>
            </app-page-header>

            <p>{{ t(vm.confirmationTextKey) }}</p>

            <app-input-textarea
                [vm]="vm.reasonInputTextareaXVM"
                [formControl]="reasonControl"
            >
                <span leftAssistiveText>
                    {{ t(vm.optionalAssistiveTextKey) }}
                </span>
            </app-input-textarea>

            <app-button [vm]="vm.submitButtonXVM" (click)="submit()">
                @if (vm.submitButtonXVM.textKey; as textKey) {
                    {{ t(textKey) }}
                }
            </app-button>

            <app-button [vm]="vm.cancelButtonXVM" (click)="myDialog.close()">
                @if (vm.cancelButtonXVM.textKey; as textKey) {
                    {{ t(textKey) }}
                }
            </app-button>
        </app-dialog>
    }
</dialog>
