<section *transloco="let t" class="flex flex-col gap-y-4">
    <div class="grid grid-cols-2">
        @if (vm(); as vm) {
            <h2>{{ t(vm.titleKey) }}</h2>
        }
        <div class="flex justify-end">
            <ng-content select="[a, app-button]" />
        </div>
    </div>
    <ng-content />
</section>
